name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Vercel
    needs: checks
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ENVIRONMENT: ${{ github.event_name == 'push' && 'production' || 'preview' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pull Vercel environment
        run: npx --yes vercel@latest pull --yes --environment="$VERCEL_ENVIRONMENT" --token="$VERCEL_TOKEN"

      - name: Build for Vercel
        run: |
          if [ "$VERCEL_ENVIRONMENT" = "production" ]; then
            npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          else
            npx --yes vercel@latest build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy to Vercel
        run: |
          if [ "$VERCEL_ENVIRONMENT" = "production" ]; then
            npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          else
            npx --yes vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN"
          fi
